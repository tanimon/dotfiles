# actionlint・just・shellcheck・shfmt・yq・zizmor の版は、dotfiles リポジトリの中では
# リポジトリの mise.toml の固定した版が優先する(ADR 0023)。ここも固定すると、同じツールの版を 2 箇所で上げることになるので固定しない。
[tools]
actionlint = "latest"
bun = "latest"
herdr = "0.9.5"
just = "latest"
node = "24.22.1"
pnpm = "12.14.0"
prek = "latest"
shellcheck = "latest"
shfmt = "latest"
yq = "latest"
zizmor = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node"]
