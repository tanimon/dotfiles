name: tanimon-global
version: 1.0.0
# 配布先は install スクリプトの --target と二重に宣言する(意図的なフェイルセーフ)。
# 根拠と APM の所有範囲は docs/adr/0006-apm-owns-only-the-mcp-servers-table-of-codex-config.md
targets:
  - claude
  - codex

# APM は MCP サーバーごとの target 指定に対応しない(書いても unknown key として
# 両製品の設定にそのまま書き込まれる)ため、配布は all-or-nothing。よって Codex 自身を
# MCP として Codex に配る再帰を避けるため、未使用の codex サーバーは宣言しない。
dependencies:
  mcp:
    # code-review-graph は /doctor(2026-09-18)で全トランスクリプト中 0 回の呼び出しと判定して削除した。
    # ここから消すと次の apm install が両 target から prune する(ADR 0006 の所有境界)。
    # prune を伴う apm install は ~/.claude.json のシンボリックリンクを平のファイルに置き換えるので、
    # apply 後に `ls -la ~/.claude.json` を必ず確認すること(CLAUDE.md の Known Pitfalls 参照)。
    - name: deepwiki
      registry: false
      transport: http
      url: https://mcp.deepwiki.com/mcp
