name: tanimon-global
version: 1.0.0
target: claude

dependencies:
  mcp:
    - name: code-review-graph
      registry: false
      transport: stdio
      command: uvx
      args: ["code-review-graph", "serve"]
    - name: codex
      registry: false
      transport: stdio
      command: codex
      args: ["-m", "gpt-5.2-codex", "mcp-server"]
    - name: deepwiki
      registry: false
      transport: http
      url: https://mcp.deepwiki.com/mcp
