repos:
  - repo: local
    hooks:
      - id: secretlint
        name: secretlint
        entry: pnpm exec secretlint
        language: system
        types: [text]
      - id: shellcheck
        name: shellcheck
        # -x: source で読み込むファイルがこの commit で staged になっていなくても
        # ディスク上のファイルを追跡させる。harness/lib/*.bash のように複数ファイルが
        # source し合う構成では、一部だけを変更する commit で他方が staged
        # されないと SC1091(info)が誤って出るため(#309 Task 2 で発覚)。
        entry: bash -c 'if command -v shellcheck &>/dev/null; then shellcheck -x "$@"; else echo "shellcheck not found, skipping"; fi' --
        language: system
        files: '(\.sh$|\.bash$|\.chezmoiscripts/|executable_)'
        exclude: '(\.tmpl$|\.mts$|\.ts$|\.mjs$)'
        types: [file]
      - id: shfmt
        name: shfmt
        entry: bash -c 'if command -v shfmt &>/dev/null; then shfmt -d -i 4 "$@"; else echo "shfmt not found, skipping"; fi' --
        language: system
        files: '(\.sh$|\.bash$|\.chezmoiscripts/|executable_)'
        exclude: '(\.tmpl$|\.mts$|\.ts$|\.mjs$)'
        types: [file]
      - id: oxlint
        name: oxlint
        entry: pnpm exec oxlint
        language: system
        files: '\.(js|mjs|mts|ts)$'
        exclude: '\.tmpl$'
        types: [file]
      - id: oxfmt
        name: oxfmt
        entry: pnpm exec oxfmt --check
        language: system
        files: '\.(js|mjs|mts|ts|json)$'
        exclude: '(\.tmpl$|modify_)'
        types: [file]
      - id: actionlint
        name: actionlint
        entry: bash -c 'if command -v actionlint &>/dev/null; then actionlint "$@"; else echo "actionlint not found, skipping"; fi' --
        language: system
        files: '\.github/workflows/.*\.yml$'
        types: [file]
      - id: zizmor
        name: zizmor
        entry: bash -c 'if command -v zizmor &>/dev/null; then zizmor "$@"; else echo "zizmor not found, skipping"; fi' --
        language: system
        files: '\.github/workflows/.*\.yml$'
        types: [file]
      # CLAUDE.md / AGENTS.md / .cursor/rules は harness/modules/ からの生成物。
      # 手編集を commit 時点で止める(検出だけ。再生成は `just harness-sync`)。
      # pass_filenames: false — `just check-instructions` はレシピ引数を取らない。
      - id: check-instructions
        name: check-instructions
        entry: bash -c 'if command -v just &>/dev/null; then just check-instructions; else echo "just not found, skipping"; fi' --
        language: system
        # Source(modules / project.json)だけでなく、生成する側(adapter・harness 本体・
        # レシピ)の変更でも発火させる。renderer を変えると Target が古くなるため
        files: '^(CLAUDE\.md|AGENTS\.md|\.cursor/rules/.*\.mdc|justfile|harness/(modules/.*|project\.json|adapters/.*|bin/.*|lib/.*))$'
        pass_filenames: false
        types: [file]
      # Not restricted to .md: a literal org path is most likely to land in a
      # template or config (settings.json.tmpl, nono profiles, gitconfig).
      # The pattern/allowlist files are excluded because they hold
      # guarded-looking text by construction.
      - id: scan-sensitive
        name: scan-sensitive
        entry: bash scripts/scan-sensitive-info.sh
        language: system
        exclude: '(^scripts/sensitive-(patterns|patterns\.local|allowlist)\.txt$|^pnpm-lock\.yaml$)'
        types: [text]
