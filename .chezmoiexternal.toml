  url = "https://github.com/affaan-m/ECC/archive/bf70150eb2df8070024e5bdf08e4aa08959e2735.tar.gz"
  # renovate: branch=main
  stripComponents = 1
  path = "commands/code-review.md"
  refreshPeriod = "168h"

