# エントリを追加するときは .claude/rules/renovate-external.md の隣接契約
# (`url = ".../archive/<sha>.tar.gz"` の直後に `# renovate: branch=<branch>`)に従うこと。

# ECC(affaan-m/ECC)から実際に使っているファイルだけを取り込む。plugin 全体(skill 292 /
# agent 68 / hook 24 系統)は読み込まない。経緯: docs/superpowers/specs/2026-09-24-ecc-minimal-install-design.md
# 4 エントリは同じ SHA を指す。Renovate はそれぞれの url 行を個別に更新する。
# rules/{typescript,web} は hooks.md を除いて include に列挙する(廃止済みの ECC hook を前提にした設定例のため)。
# exclude を足すと include 外のファイルまで取り込まれるので使わない。
[".claude/commands/ecc-code-review.md"]
  type = "archive-file"
  url = "https://github.com/affaan-m/ECC/archive/bf70150eb2df8070024e5bdf08e4aa08959e2735.tar.gz"
  # renovate: branch=main
  stripComponents = 1
  path = "commands/code-review.md"
  refreshPeriod = "168h"

[".claude/agents"]
  type = "archive"
  url = "https://github.com/affaan-m/ECC/archive/bf70150eb2df8070024e5bdf08e4aa08959e2735.tar.gz"
  # renovate: branch=main
  stripComponents = 2
  include = ["*/agents/vue-reviewer.md", "*/agents/php-reviewer.md", "*/agents/security-reviewer.md", "*/agents/pr-test-analyzer.md"]
  refreshPeriod = "168h"

[".claude/rules/typescript"]
  type = "archive"
  url = "https://github.com/affaan-m/ECC/archive/bf70150eb2df8070024e5bdf08e4aa08959e2735.tar.gz"
  # renovate: branch=main
  stripComponents = 3
  include = ["*/rules/typescript/coding-style.md", "*/rules/typescript/patterns.md", "*/rules/typescript/security.md", "*/rules/typescript/testing.md"]
  refreshPeriod = "168h"

[".claude/rules/web"]
  type = "archive"
  url = "https://github.com/affaan-m/ECC/archive/bf70150eb2df8070024e5bdf08e4aa08959e2735.tar.gz"
  # renovate: branch=main
  stripComponents = 3
  include = ["*/rules/web/coding-style.md", "*/rules/web/design-quality.md", "*/rules/web/patterns.md", "*/rules/web/performance.md", "*/rules/web/security.md", "*/rules/web/testing.md"]
  refreshPeriod = "168h"

# openai/skills の curated skill `define-goal` を Claude Code と Codex の両方に配る。
# 本来は Codex の goal ツール(get_goal / create_goal)を呼ぶ前提で書かれており、Claude Code では
# その手順(5・6)だけが空振りする。原文のまま使うと決めたうえで取り込んでいる(2026-10-01)。
# Codex 側は ~/.agents/skills ではなく ~/.codex/skills に置く(~/.agents/ は .chezmoiignore 済み)。
# 2 エントリは同じ SHA を指す。agents/openai.yaml は Codex アプリの表示用メタデータなので取り込まない。
[".claude/skills/define-goal"]
  type = "archive"
  url = "https://github.com/openai/skills/archive/49f948faa9258a0c61caceaf225e179651397431.tar.gz"
  # renovate: branch=main
  stripComponents = 4
  include = ["*/skills/.curated/define-goal/SKILL.md", "*/skills/.curated/define-goal/LICENSE.txt"]
  refreshPeriod = "168h"

[".codex/skills/define-goal"]
  type = "archive"
  url = "https://github.com/openai/skills/archive/49f948faa9258a0c61caceaf225e179651397431.tar.gz"
  # renovate: branch=main
  stripComponents = 4
  include = ["*/skills/.curated/define-goal/SKILL.md", "*/skills/.curated/define-goal/LICENSE.txt"]
  refreshPeriod = "168h"

# github/gh-stack の skill `gh-stack` を Claude Code と Codex の両方に配る。upstream は
# `gh skill install github/gh-stack` を案内しているが、宣言的に再現できるよう archive で取り込む(2026-10-02)。
# skill が呼ぶ `gh stack` 拡張本体は dot_config/gh/extensions.txt で入れる。拡張は最新版を入れるので、
# この SHA と拡張のバージョンは一致しない(Renovate が skill を追随させる)。
# 2 エントリは同じ SHA を指す。LICENSE(MIT)は skill ディレクトリの外にあるので取り込まない。
# include はディレクトリエントリにも効くので `references` 自体も列挙する。`references/*.md` だけだと
# ディレクトリが作られず、apply が `stat …/references: no such file or directory` で失敗する。
[".claude/skills/gh-stack"]
  type = "archive"
  url = "https://github.com/github/gh-stack/archive/d4ab7ab47e5b3e3708a27c8c42abcdf4bc321419.tar.gz"
  # renovate: branch=main
  stripComponents = 3
  include = ["*/skills/gh-stack/SKILL.md", "*/skills/gh-stack/references", "*/skills/gh-stack/references/*.md"]
  refreshPeriod = "168h"

[".codex/skills/gh-stack"]
  type = "archive"
  url = "https://github.com/github/gh-stack/archive/d4ab7ab47e5b3e3708a27c8c42abcdf4bc321419.tar.gz"
  # renovate: branch=main
  stripComponents = 3
  include = ["*/skills/gh-stack/SKILL.md", "*/skills/gh-stack/references", "*/skills/gh-stack/references/*.md"]
  refreshPeriod = "168h"
