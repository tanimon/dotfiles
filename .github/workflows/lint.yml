name: Lint
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# 各 job のツール導入は .github/actions/setup-lint に集約している。どの job がどの
# just レシピを呼ぶかは test/ci-parity.bats が justfile の `lint:` と突き合わせる。
jobs:
  secretlint:
    name: Secretlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lint
        with:
          pnpm: 'true'
      - run: just secretlint

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lint
      - run: just shellcheck

  shfmt:
    name: shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lint
        with:
          shfmt: 'true'
      - run: just shfmt

  oxlint:
    name: oxlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lint
        with:
          pnpm: 'true'
      - run: just oxlint

  oxfmt:
    name: oxfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lint
        with:
          pnpm: 'true'
      - run: just oxfmt

  modify-scripts:
    name: modify_ script smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lint
        with:
          pnpm: 'true'
      - run: just test-modify

  harness-scripts:
    name: harness script smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lint
        with:
          pnpm: 'true'
      - run: just test-scripts

  harness-loop-scripts:
    name: harness loop script smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lint
        with:
          pnpm: 'true'
      - run: just test-harness-scripts

  # pull_request の checkout は merge commit になる。第 1 親(base)と比べるので
  # fetch-depth: 2 が要る。ブランチ名はスクリプトが GITHUB_HEAD_REF から読む。
  # 最初の step は base 側のガードを just を経由せずに実行する。head 側のスクリプト・
  # justfile・setup-lint を書き換えたループの PR でも、base の判定で落とすため。
  # setup-lint(head 側)より前に置くのは、PATH などを書き換えられる前に走らせるため。
  # base にガードが無い(導入前の base)ときだけ、この step は判定せずに通る。
  # base(HEAD^1)そのものを解決できないとき(checkout の深さ不足など)は通さない。
  evaluator-guard:
    name: Evaluator guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: base 側のガードで判定する
        run: |
          if ! git rev-parse --verify --quiet 'HEAD^1^{commit}' >/dev/null; then
            echo "base (HEAD^1) を解決できないので判定できない" >&2
            exit 2
          fi
          if ! git cat-file -e 'HEAD^1:scripts/check-evaluator-guard.sh' 2>/dev/null; then
            echo "base にガードが無いので、base 側の判定は行わない"
            exit 0
          fi
          git show 'HEAD^1:scripts/check-evaluator-guard.sh' >"$RUNNER_TEMP/check-evaluator-guard.sh"
          bash "$RUNNER_TEMP/check-evaluator-guard.sh"
      - uses: ./.github/actions/setup-lint
      - run: just check-evaluator-guard

  test-evaluator-guard:
    name: Evaluator guard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lint
        with:
          pnpm: 'true'
      - run: just test-evaluator-guard

  instruction-size:
    name: Instruction size limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lint
      - run: just check-instruction-size

  test-instruction-size:
    name: Instruction size limit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lint
        with:
          pnpm: 'true'
      - run: just test-instruction-size

  harness-sync:
    name: harness sync smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lint
        with:
          pnpm: 'true'
      - run: just test-harness-sync

  harness-instructions:
    name: agent instruction drift + harness/apm smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lint
        with:
          pnpm: 'true'
      - run: just check-instructions
      - run: just test-harness-instructions
      # CI に apm CLI は無いので配布の実測ケースは skip され、Source の静的検査
      # (apm.yml の targets / install script の --target) だけが走る。skip した
      # ケースと理由は bats が出力するので、緑の実行が実測を詐称しない。
      - run: just test-apm-mcp
      # 偽 apm と偽ホームだけで動くので、CI に apm が無くても skip せず実測できる。
      - run: just test-apm-install

  actionlint:
    name: actionlint + CI parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lint
        with:
          pnpm: 'true'
          actionlint: 'true'
      - run: just actionlint
      # yq は runner に入っているもの(mikefarah 版)を使う。版の確認は bats 側で行う。
      - run: just test-ci-parity

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lint
        with:
          zizmor: 'true'
      - run: just zizmor

  # ubuntu-latest には ruby と shellcheck が入っているので導入しない。shellcheck が無いと
  # 検査は bash -n だけに落ち、テストの一部が skip になるので、無ければここで落とす。
  composite-actions:
    name: composite action scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lint
        with:
          pnpm: 'true'
      - run: shellcheck --version
      - run: just check-composite-actions
      - run: just test-composite-actions

  scan-sensitive:
    name: Scan sensitive info
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lint
      - run: just scan-sensitive

  test-sensitive:
    name: sensitive scan smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lint
        with:
          pnpm: 'true'
      - run: just test-sensitive

  check-comment-noise:
    name: Check comment noise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lint
      - run: just check-comment-noise

  test-comment-noise:
    name: comment noise smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lint
        with:
          pnpm: 'true'
      - run: just test-comment-noise

  test-pr-context:
    name: pr-context smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lint
        with:
          pnpm: 'true'
      - run: just test-pr-context

  test-deliver:
    name: deliver workflow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lint
        with:
          node: 'true'
      - run: just test-deliver

  chezmoi-templates:
    name: chezmoi templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lint
        with:
          chezmoi: 'true'
      - run: just check-templates

  global-instructions:
    name: global instruction composition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # chezmoi は必須。test/global-instructions.bats は chezmoi が無いと skip せず
      # fail する(skip にすると共有本文の不変条件が CI で空振りする)
      - uses: ./.github/actions/setup-lint
        with:
          pnpm: 'true'
          chezmoi: 'true'
      - run: just test-global-instructions

  settings-hooks:
    name: settings hook wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # chezmoi は必須。test/settings-hooks.bats は chezmoi が無いと skip せず
      # fail する(skip にすると guard の配線検査が CI で空振りする)
      - uses: ./.github/actions/setup-lint
        with:
          pnpm: 'true'
          chezmoi: 'true'
      - run: just test-settings-hooks

  guard-contract:
    name: guard hook startup contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # chezmoi は必須。test/guard-contract.bats は描画した settings.json の配線を一覧と照合するので、
      # chezmoi が無いと skip せず fail する
      - uses: ./.github/actions/setup-lint
        with:
          pnpm: 'true'
          chezmoi: 'true'
      - run: just test-guard-contract

  gitconfig:
    name: git push without upstream config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # chezmoi は必須。test/gitconfig.bats は描画した ~/.gitconfig を使うので、
      # chezmoi が無いと skip せず fail する
      - uses: ./.github/actions/setup-lint
        with:
          pnpm: 'true'
          chezmoi: 'true'
      # status.compareBranches を知らない git は黙って無視するので、版を記録して失敗と見分ける
      - run: git --version
      - run: just test-gitconfig
