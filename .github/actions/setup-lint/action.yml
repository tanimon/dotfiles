name: Setup lint tools
description: >
  lint を回す job(lint.yml の各 job と security-alerts.yml の sweep)が使うツールを導入する。just・shellcheck・yq は常に入れ、それ以外は input で選ぶ。
  lint ツールの版はリポジトリの mise.toml にだけ書き(ADR 0023)、ここでは mise でそこから入れる。
  node / pnpm の版は .node-version と package.json の packageManager から読む。それ以外の版と、
  checkout 以外の action の pin はこのファイルにだけ書く(job ごとに写すと、更新が一部の job に
  しか届かない drift が起きるため)。
  checkout はこの action の外で先に行うこと(action 自身を読むために要る)。そのため
  checkout の pin だけは lint.yml の各 job に残る。

inputs:
  node:
    description: node を .node-version の版で導入する(pnpm は入れない)
    default: 'false'
  pnpm:
    description: pnpm と node を導入し、pnpm install --frozen-lockfile まで行う
    default: 'false'
  chezmoi:
    description: chezmoi(最新版)を導入する
    default: 'false'
  shfmt:
    description: shfmt を mise.toml の版で導入する
    default: 'false'
  actionlint:
    description: actionlint を mise.toml の版で導入する
    default: 'false'
  zizmor:
    description: zizmor を mise.toml の版で導入する
    default: 'false'
  zsh:
    description: zsh(apt の版。固定しない)を導入する。ubuntu runner には既定で入っていない
    default: 'false'

runs:
  using: composite
  steps:
    - if: inputs.pnpm == 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - if: inputs.pnpm == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.node-version'
        cache: pnpm
    - if: inputs.pnpm == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
    - if: inputs.node == 'true' && inputs.pnpm != 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.node-version'
    - if: inputs.chezmoi == 'true'
      name: Install chezmoi
      shell: bash
      run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
    - if: inputs.zsh == 'true'
      name: Install zsh
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
    # shellcheck と yq を常に入れる理由は ADR 0023
    - name: Select mise tools
      id: mise-tools
      shell: bash
      env:
        SHFMT: ${{ inputs.shfmt }}
        ACTIONLINT: ${{ inputs.actionlint }}
        ZIZMOR: ${{ inputs.zizmor }}
      run: |
        tools="just shellcheck yq"
        if [ "$SHFMT" = true ]; then tools="$tools shfmt"; fi
        if [ "$ACTIONLINT" = true ]; then tools="$tools actionlint"; fi
        if [ "$ZIZMOR" = true ]; then tools="$tools zizmor"; fi
        echo "tools=$tools" >> "$GITHUB_OUTPUT"
    # mise はワークスペースの外に置いた mise.toml の写しだけを読む(ADR 0023)。ワークスペースで動かすと、
    # mise.local.toml・.tool-versions・mise.<env>.toml など名前の決まらない設定も読み、mise-action が
    # ワークスペースを信頼済みにするので、それらのテンプレートや [env] _.path も評価して版や PATH を差し替えられる
    - name: Copy mise.toml
      id: mise-dir
      shell: bash
      run: |
        dir="${RUNNER_TEMP}/setup-lint-mise"
        mkdir -p "$dir"
        cp mise.toml "$dir/"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
    # shims は呼ばれたディレクトリの設定で版を選ぶので PATH に足さない。導入先は env の export_path が PATH に足す
    - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      with:
        version: 2026.10.11
        working_directory: ${{ steps.mise-dir.outputs.dir }}
        add_shims_to_path: 'false'
        install_args: ${{ steps.mise-tools.outputs.tools }}
    # 入れた各ツールが mise.toml の版の導入先に解決されることを確かめる(ADR 0023)
    - name: Check mise tools
      shell: bash
      working-directory: ${{ steps.mise-dir.outputs.dir }}
      env:
        TOOLS: ${{ steps.mise-tools.outputs.tools }}
      run: |
        for tool in $TOOLS; do
          expected=$(mise which "$tool") || {
            echo "::error::${tool} が mise.toml の版に解決されない(mise which が失敗した)"
            exit 1
          }
          resolved=$(command -v "$tool") || resolved=
          case "$resolved" in
            "$expected") ;;
            *)
              echo "::error::${tool} が mise.toml の版(${expected})に解決されない: ${resolved:-見つからない}"
              exit 1
              ;;
          esac
        done
