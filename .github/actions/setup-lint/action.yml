name: Setup lint tools
description: >
  lint.yml の各 job が使うツールを導入する。just・shellcheck・yq は常に入れ、それ以外は input で選ぶ。
  lint ツールの版はリポジトリの mise.toml にだけ書き(ADR 0023)、ここでは mise でそこから入れる。
  node / pnpm の版は .node-version と package.json の packageManager から読む。それ以外の版と、
  checkout 以外の action の pin はこのファイルにだけ書く(job ごとに写すと、更新が一部の job に
  しか届かない drift が起きるため)。
  checkout はこの action の外で先に行うこと(action 自身を読むために要る)。そのため
  checkout の pin だけは lint.yml の各 job に残る。

inputs:
  node:
    description: node を .node-version の版で導入する(pnpm は入れない)
    default: 'false'
  pnpm:
    description: pnpm と node を導入し、pnpm install --frozen-lockfile まで行う
    default: 'false'
  chezmoi:
    description: chezmoi(最新版)を導入する
    default: 'false'
  shfmt:
    description: shfmt を mise.toml の版で導入する
    default: 'false'
  actionlint:
    description: actionlint を mise.toml の版で導入する
    default: 'false'
  zizmor:
    description: zizmor を mise.toml の版で導入する
    default: 'false'
  zsh:
    description: zsh(apt の版。固定しない)を導入する。ubuntu runner には既定で入っていない
    default: 'false'

runs:
  using: composite
  steps:
    - if: inputs.pnpm == 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - if: inputs.pnpm == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.node-version'
        cache: pnpm
    - if: inputs.pnpm == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
    - if: inputs.node == 'true' && inputs.pnpm != 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.node-version'
    - if: inputs.chezmoi == 'true'
      name: Install chezmoi
      shell: bash
      run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
    - if: inputs.zsh == 'true'
      name: Install zsh
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
    # shellcheck と yq は runner にも入っている。input にすると、要求し忘れた job が runner の版で
    # 黙って走るので、just と同じく常に入れる
    - name: Select mise tools
      id: mise-tools
      shell: bash
      env:
        SHFMT: ${{ inputs.shfmt }}
        ACTIONLINT: ${{ inputs.actionlint }}
        ZIZMOR: ${{ inputs.zizmor }}
      run: |
        tools="just shellcheck yq"
        if [ "$SHFMT" = true ]; then tools="$tools shfmt"; fi
        if [ "$ACTIONLINT" = true ]; then tools="$tools actionlint"; fi
        if [ "$ZIZMOR" = true ]; then tools="$tools zizmor"; fi
        echo "tools=$tools" >> "$GITHUB_OUTPUT"
    - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      with:
        # renovate: datasource=github-releases depName=jdx/mise
        version: 2026.10.11
        install_args: ${{ steps.mise-tools.outputs.tools }}
    # mise.toml に無い名前は `mise install` が最新版を入れて通り、入れ損ねた名前は PATH 上の runner の版に
    # 解決される。どちらも版の固定が黙って外れるので、mise.toml の版の shim に解決されることを確かめる
    - name: Check mise tools
      shell: bash
      env:
        TOOLS: ${{ steps.mise-tools.outputs.tools }}
      run: |
        for tool in $TOOLS; do
          mise which "$tool" >/dev/null
          case "$(command -v "$tool")" in
            */mise/shims/*) ;;
            *)
              echo "::error::$tool が mise の shim に解決されない: $(command -v "$tool")"
              exit 1
              ;;
          esac
        done
